name: Fetch Apps Script Data

on:
  schedule:
    - cron: '0 */6 * * *'  # her 6 saatte bir
  workflow_dispatch:  # manuel tetikleme için

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Apps Script
        run: |
          curl -L \
            "https://script.google.com/macros/s/AKfycby1IpocaJYQ1Xfh1mtrVUzw-3r1o9Q2LognWg5YIHxxWhEqfKRy9b2SiNWkT48XkM2E/exec" \
            | gzip > src/data/num_yorum.bin

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/num_yorum.bin
          git diff --staged --quiet || git commit -m "data: num_yorum.bin güncellendi"
          git push