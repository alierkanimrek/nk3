name: Fetch Blog Data

on:
  schedule:
    - cron: '0 0 * * *'  # her gün gece 12'de
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch blog posts
        run: |
          curl -L \
            "https://script.google.com/macros/s/AKfycbyc91JOD9699twF-wixEymXy4l4DVsk6jWVQqssVQ9OnJ06K_MCZdvuhdN7bN2K7oxU/exec" \
            | gzip > public/pranik_blog.bin

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pranik_blog.bin
          git diff --staged --quiet || git commit -m "data: pranik_blog.bin güncellendi"
          git push